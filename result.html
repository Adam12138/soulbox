<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽签结果</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #FEE3EC 0%, #F2E6F0 50%, #B1BEF2 100%);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        /* 雪花容器 */
        #result-snow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
            display: block;
            overflow: hidden;
        }
        
        /* 雪花动画 */
        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 0.5;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* 玻璃拟态结果容器 */
        .result-container {
            width: 90%;
            max-width: 500px;
            /* 玻璃拟态效果 */
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(245, 196, 226, 0.4);
            box-shadow: 0 8px 32px 0 rgba(177, 190, 242, 0.2);
            padding: 30px;
            text-align: center;
            z-index: 10;
        }

        /* 标题样式 */
        h1 {
            font-size: 32px;
            color: #000;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.5);
            font-weight: bold;
        }

        /* 卦象名称样式 */
        #hexagram-name {
            font-size: 28px;
            color: #000;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
            font-weight: bold;
        }

        /* 卦象解释样式 */
        #hexagram-explanation {
            font-size: 16px;
            line-height: 1.6;
            color: #000;
            margin-bottom: 30px;
            text-align: left;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
        }

        /* 玻璃拟态重置按钮 */
        .reset-btn {
            padding: 16px 40px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            /* 玻璃拟态效果 */
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(245, 196, 226, 0.5);
            border-radius: 35px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(177, 190, 242, 0.2);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .reset-btn:hover {
            box-shadow: 0 8px 20px rgba(177, 190, 242, 0.3);
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.4);
        }

        .reset-btn:active {
            box-shadow: 0 2px 8px rgba(177, 190, 242, 0.2);
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div id="result-snow-container"></div>
    <div class="result-container">
        <h1>抽签结果</h1>
        <h2 id="hexagram-name"></h2>
        <div id="hexagram-explanation"></div>
        <button class="reset-btn" onclick="location.href='index.html'">重新抽签</button>
    </div>
    <div id="petals-container"></div>
    
    <script>
        // 从URL获取参数
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // 显示抽签结果并创建雪花
        window.onload = function() {
            // 创建雪花
            const snowContainer = document.getElementById('result-snow-container');
            if (snowContainer) {
                for (let i = 0; i < 50; i++) {
                    const snowflake = document.createElement('div');
                    snowflake.style.position = 'absolute';
                    snowflake.style.width = (Math.random() * 10 + 5) + 'px';
                    snowflake.style.height = snowflake.style.width;
                    snowflake.style.backgroundColor = '#ffffff';
                    snowflake.style.borderRadius = '50%';
                    snowflake.style.opacity = '0.9';
                    snowflake.style.left = (Math.random() * 100) + '%';
                    // 随机位置，不只是从顶部开始
                    snowflake.style.top = (Math.random() * 100) + '%';
                    snowflake.style.boxShadow = '0 0 10px #ffffff';
                    snowflake.style.animation = 'fall ' + (Math.random() * 5 + 5) + 's linear infinite';
                    snowflake.style.animationDelay = '0s';
                    snowflake.style.zIndex = '10';
                    snowContainer.appendChild(snowflake);
                }
            }
            
            // 显示抽签结果
            const name = getQueryParam('name');
            const explanation = getQueryParam('explanation');
            
            if (name && explanation) {
                document.getElementById('hexagram-name').textContent = name;
                document.getElementById('hexagram-explanation').textContent = explanation;
            }
        };
    </script>
</body>
</html>
